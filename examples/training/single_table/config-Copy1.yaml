# Training example configuration
# Base data directory (can be overridden from command line)
base_data_dir: examples/training/single_table/data_diabetes_1K
results_dir: examples/training/single_table/results_diabetes_1K

diffusion_config:
  d_layers: [512, 1024, 1024, 1024, 1024, 512]
  dropout: 0.0
  num_timesteps: 2000
  model_type: mlp
  iterations: 20000
  batch_size: 4096
  lr: 0.0006
  gaussian_loss_type: mse
  weight_decay: 1e-05
  scheduler: cosine
  data_split_ratios: [0.99, 0.005, 0.005]
