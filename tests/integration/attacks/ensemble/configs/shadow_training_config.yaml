# Test assets directory
base_test_assets_dir: tests/integration/attacks/ensemble/assets

# Training and data settings for shadow models
shadow_training:
  # Data Config files path used for training a TabDDPM model
  training_json_config_paths: # Config json files used for tabddpm training on the trans table
    table_domain_file_path: ${base_test_assets_dir}/data_configs/trans_domain.json
    dataset_meta_file_path: ${base_test_assets_dir}/data_configs/dataset_meta.json
    training_config_path: ${base_test_assets_dir}/data_configs/trans.json
  # Model training artifacts are saved under shadow_models_data_path/workspace_name/exp_name
  # Also, training configs for each shadow model are created under shadow_models_data_path.
  shadow_models_output_path: ${base_test_assets_dir}/shadow_models_data
  fine_tuning_config:
    fine_tune_diffusion_iterations: 2
    fine_tune_classifier_iterations: 2
    pre_train_data_size: 50 # We want to only use 50 samples for pre-training.


# General settings
random_seed: 42
