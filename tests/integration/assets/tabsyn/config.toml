task_type = "regression"

[model_params]
n_head = 1
factor = 32
num_layers = 2
d_token = 4

[transforms]
normalization = "quantile"
numerical_nan_policy = "mean"
categorical_nan_policy = "__none__"
category_minimum_frequency = "__none__"
categorical_encoding = "__none__"
target_policy = "default"

[train.vae]
num_epochs = 10
batch_size = 10
num_dataset_workers = 1

[train.diffusion]
num_epochs = 10
batch_size = 10
num_dataset_workers = 1

[train.optim.vae]
lr = 1e-3
weight_decay = 0
factor = 0.95
patience = 10

[train.optim.diffusion]
lr = 1e-3
weight_decay = 0
factor = 0.9
patience = 20

[loss_params]
max_beta = 1e-2
min_beta = 1e-5
lambd = 0.7
